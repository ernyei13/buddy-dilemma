plugins {
    id 'com.android.application'
}

android {
    namespace 'se.kth.buddydilemma'
    compileSdk 33

    defaultConfig {
        applicationId "se.kth.buddydilemma"
        minSdk 24
        targetSdk 29
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1'
    // Blue Frog Robotics SDK (needs credentials.gradle)
    implementation 'com.bluefrogrobotics.buddy:BuddySDK:2.4+'
    // WebSocket client to talk to the laptop
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
