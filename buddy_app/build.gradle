// Project build file. The Blue Frog Maven setup follows the Buddy SDK 2.4 user guide.
//
// With credentials.gradle (your Blue Frog login, git-ignored) the app builds against the REAL
// Buddy SDK. Without it, it builds against buddy_sdk_stub (same API, calls only log), so the
// project still compiles and runs on any Android phone or emulator.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}

ext.useRealBuddySdk = file("credentials.gradle").exists() && !project.hasProperty("useSdkStub")
if (ext.useRealBuddySdk) {
    apply from: "credentials.gradle"
} else {
    println "BuddyDilemma: no credentials.gradle -> building with the STAND-IN Buddy SDK (not for the real robot)"
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        if (rootProject.ext.useRealBuddySdk) {
            // Blue Frog Robotics SDK repository
            maven {
                url "https://bluefrogrobotics.jfrog.io/artifactory/bluefrogrobotics-libs-release-local/"
                credentials {
                    username rootProject.ext.maven_user
                    password rootProject.ext.maven_password
                }
            }
        }
    }
}
