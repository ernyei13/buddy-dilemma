plugins {
    id 'com.android.application'
}

android {
    namespace 'se.kth.buddydilemma'
    compileSdk 34

    defaultConfig {
        applicationId "se.kth.buddydilemma"
        minSdk 24
        targetSdk 29
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    if (rootProject.ext.useRealBuddySdk) {
        implementation 'com.bluefrogrobotics.buddy:BuddySDK:2.4+'   // real robot
    } else {
        implementation project(':buddy_sdk_stub')                   // stand-in, see build.gradle
    }
    // WebSocket client to talk to the laptop
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
